<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore - UniSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container section">
    <div class="layout">
      <div class="filters">
        <h3>Filters</h3>
        <label>Category</label>
        <select id="fCat"></select>
        <label>Condition</label>
        <select id="fCond">
          <option>All</option><option>Like New</option><option>Good</option><option>Fair</option>
        </select>
        <label>Maximum price (₹)</label>
        <input type="number" id="fMax" placeholder="e.g. 500">
        <label>Sort by</label>
        <select id="fSort">
          <option value="new">Newest</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
        <button class="btn btn-outline btn-full" onclick="location.href='explore.html'">Reset</button>
      </div>

      <div>
        <h2 id="countText"></h2>
        <br>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
